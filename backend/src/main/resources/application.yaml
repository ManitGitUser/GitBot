spring:
  application:
    name: GitBot

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/gitbot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:3003}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

#  flyway:
#    enabled: true
#    locations: classpath:db/migration
#    baseline-on-migrate: true


  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: gpt-4o-mini
      embedding:
        model: text-embedding-3-small

#    vectorstore:
#      pgvector:
#        initialize-schema: true
#        index-type: HNSW
#        distance-type: COSINE_DISTANCE

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:Ov23li6IQoNRiJiAXbuSs}
            client-secret: ${GITHUB_CLIENT_SECRET:9ebe0ac496bc81f04c5713335e62f165f0204810}
            scope:
              - read:user,repo
        provider:
          github:
            user-name-attribute: id

server:
  servlet:
    session:
      cookie:
        name: GITBOT_SESSION
        http-only: true
        same-site: lax
      timeout: 7d

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  token-encryptor-password: ${TOKEN_ENCRYPTOR_PASSWORD:gitbot-local-encrypt-key-change-me}
  token-encryptor-salt: ${TOKEN_ENCRYPTOR_SALT:a1b2c3d4e5f6}
  indexing:
    max-file-bytes: 102400
    chunk-size: 800
    chunk-overlap: 100
  github:
    api-delay-ms: 50