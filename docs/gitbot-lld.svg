<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow-lld" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arr-lld" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="40" y="44" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="-0.5">GitBot — Low-Level Design (LLD) &amp; Component Architecture</text>
  <text x="40" y="68" fill="#94a3b8" font-size="12">Class Boundaries, Security Handlers, Async Pipelines, Retrieval Algorithms &amp; Entity Relationships</text>
  <rect x="1050" y="30" width="110" height="24" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="1105" y="46" fill="#10b981" font-size="11" font-weight="600" text-anchor="middle">Layered Architecture</text>

  <!-- LAYER 1: WEB & SECURITY INGRESS LAYER -->
  <g transform="translate(40, 90)">
    <rect width="1120" height="155" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2" filter="url(#shadow-lld)"/>
    <rect x="16" y="12" width="190" height="26" rx="6" fill="#0284c7" fill-opacity="0.2"/>
    <text x="26" y="29" fill="#38bdf8" font-size="11" font-weight="700">1. PRESENTATION &amp; SECURITY LAYER</text>

    <!-- Controllers -->
    <rect x="20" y="48" width="190" height="92" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="32" y="70" fill="#f8fafc" font-size="12" font-weight="600">REST &amp; SSE Controllers</text>
    <text x="32" y="88" fill="#94a3b8" font-size="10">• AuthController (/api/auth)</text>
    <text x="32" y="103" fill="#94a3b8" font-size="10">• RepoController (/api/repos)</text>
    <text x="32" y="118" fill="#94a3b8" font-size="10">• ChatController (/api/repos/{id}/chat)</text>
    <text x="32" y="133" fill="#94a3b8" font-size="10">• DemoController (/api/demo)</text>

    <!-- Security Filters -->
    <rect x="230" y="48" width="220" height="92" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="242" y="70" fill="#c084fc" font-size="12" font-weight="600">SecurityFilterConfig</text>
    <text x="242" y="88" fill="#94a3b8" font-size="10">• OAuth2LoginConfigurer</text>
    <text x="242" y="103" fill="#94a3b8" font-size="10">• SessionManagement (SameSite=Lax)</text>
    <text x="242" y="118" fill="#94a3b8" font-size="10">• CookieCsrfTokenRepository</text>
    <text x="242" y="133" fill="#94a3b8" font-size="10">• CorsConfigurationSource</text>

    <!-- Custom Handlers -->
    <rect x="470" y="48" width="230" height="92" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="482" y="70" fill="#38bdf8" font-size="12" font-weight="600">SpaCsrfTokenRequestHandler</text>
    <text x="482" y="88" fill="#94a3b8" font-size="10">• resolveCsrfTokenValue(request)</text>
    <text x="482" y="103" fill="#94a3b8" font-size="10">• XOR Masked Token Unmasking</text>
    <text x="482" y="118" fill="#94a3b8" font-size="10">• Raw Header Fallback for Local Dev</text>
    <text x="482" y="133" fill="#38bdf8" font-size="10">• Eliminates Cross-Origin 403 on Prod</text>

    <!-- OAuth2 Service -->
    <rect x="720" y="48" width="180" height="92" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="732" y="70" fill="#38bdf8" font-size="12" font-weight="600">CustomOAuth2UserService</text>
    <text x="732" y="88" fill="#94a3b8" font-size="10">• loadUser(OAuth2UserRequest)</text>
    <text x="732" y="103" fill="#94a3b8" font-size="10">• Synchronizes GitHub User</text>
    <text x="732" y="118" fill="#94a3b8" font-size="10">• Wraps in UserPrincipal</text>
    <text x="732" y="133" fill="#94a3b8" font-size="10">• Preserves User UUID in Session</text>

    <!-- Token Encryption -->
    <rect x="920" y="48" width="180" height="92" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="932" y="70" fill="#f59e0b" font-size="12" font-weight="600">SecurityCryptoService</text>
    <text x="932" y="88" fill="#94a3b8" font-size="10">• AES-256 TextEncryptor</text>
    <text x="932" y="103" fill="#94a3b8" font-size="10">• PBKDF2 Key Derivation</text>
    <text x="932" y="118" fill="#94a3b8" font-size="10">• Hex Salt Generation</text>
    <text x="932" y="133" fill="#94a3b8" font-size="10">• Encrypts GitHub PAT in DB</text>
  </g>

  <!-- LAYER 2: BUSINESS & DOMAIN SERVICES -->
  <g transform="translate(40, 265)">
    <rect width="1120" height="280" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2" filter="url(#shadow-lld)"/>
    <rect x="16" y="12" width="160" height="26" rx="6" fill="#10b981" fill-opacity="0.2"/>
    <text x="26" y="29" fill="#34d399" font-size="11" font-weight="700">2. DOMAIN &amp; SERVICE LAYER</text>

    <!-- Indexing Pipeline Group -->
    <rect x="20" y="48" width="350" height="215" rx="10" fill="#1e293b" stroke="#10b981" stroke-dasharray="3 3"/>
    <text x="32" y="70" fill="#10b981" font-size="12" font-weight="700">ASYNC INGESTION SUBSYSTEM</text>

    <rect x="32" y="82" width="326" height="52" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="42" y="100" fill="#f8fafc" font-size="11" font-weight="600">IndexingService</text>
    <text x="42" y="115" fill="#94a3b8" font-size="10">@Async("indexingExecutor") • Thread pool: 1 core, 2 max, queue: 25</text>
    <text x="42" y="127" fill="#10b981" font-size="10">State Machine: PENDING → INDEXING → READY / FAILED</text>

    <rect x="32" y="142" width="158" height="52" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="42" y="160" fill="#f8fafc" font-size="11" font-weight="600">CodeFileFilter</text>
    <text x="42" y="174" fill="#94a3b8" font-size="10">Filters binaries, lockfiles,</text>
    <text x="42" y="186" fill="#94a3b8" font-size="10">vendors &amp; files &gt; 100 KB</text>

    <rect x="200" y="142" width="158" height="52" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="210" y="160" fill="#f8fafc" font-size="11" font-weight="600">CodeChunker</text>
    <text x="210" y="174" fill="#94a3b8" font-size="10">Max 60 lines / 1500 chars</text>
    <text x="210" y="186" fill="#94a3b8" font-size="10">10 lines structural overlap</text>

    <rect x="32" y="202" width="326" height="50" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="42" y="220" fill="#f8fafc" font-size="11" font-weight="600">GitHubApiClient &amp; GitHubRateLimiter</text>
    <text x="42" y="235" fill="#94a3b8" font-size="10">Recursive tree traversal (/git/trees/:sha?recursive=1) + 50ms throttler</text>

    <!-- RAG Retrieval & Prompt Core -->
    <rect x="390" y="48" width="370" height="215" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-dasharray="3 3"/>
    <text x="402" y="70" fill="#38bdf8" font-size="12" font-weight="700">RAG RETRIEVAL &amp; PROMPT ENGINE</text>

    <rect x="402" y="82" width="346" height="52" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="412" y="100" fill="#f8fafc" font-size="11" font-weight="600">CodeContextRetriever</text>
    <text x="412" y="115" fill="#94a3b8" font-size="10">OpenAI embed query → MetadataFilter(repoId) → Cosine top-5</text>
    <text x="412" y="127" fill="#38bdf8" font-size="10">Chunk expansion: queries chunkIndex ± 1 via lightweight SQL</text>

    <rect x="402" y="142" width="168" height="52" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="412" y="160" fill="#f8fafc" font-size="11" font-weight="600">LexicalFallbackSearch</text>
    <text x="412" y="174" fill="#94a3b8" font-size="10">Exact ILIKE fallback</text>
    <text x="412" y="186" fill="#94a3b8" font-size="10">for identifiers &amp; methods</text>

    <rect x="580" y="142" width="168" height="52" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="590" y="160" fill="#f8fafc" font-size="11" font-weight="600">ChatPromptBuilder</text>
    <text x="590" y="174" fill="#94a3b8" font-size="10">Structured XML blocks</text>
    <text x="590" y="186" fill="#94a3b8" font-size="10">Capped at 12,000 chars</text>

    <rect x="402" y="202" width="346" height="50" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="412" y="220" fill="#f8fafc" font-size="11" font-weight="600">CitationMapper &amp; Grounding</text>
    <text x="412" y="235" fill="#94a3b8" font-size="10">Maps file paths, startLine &amp; endLine into JSON citation payload</text>

    <!-- Chat Streaming & Demo Services -->
    <rect x="780" y="48" width="320" height="215" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-dasharray="3 3"/>
    <text x="792" y="70" fill="#f59e0b" font-size="12" font-weight="700">CHAT STREAMING &amp; DEMO ENGINE</text>

    <rect x="792" y="82" width="296" height="52" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="802" y="100" fill="#f8fafc" font-size="11" font-weight="600">ChatService &amp; SseEmitter Handler</text>
    <text x="802" y="115" fill="#94a3b8" font-size="10">Subscribes to Flux&lt;ChatResponse&gt; (gpt-4o-mini)</text>
    <text x="802" y="127" fill="#10b981" font-size="10">Pushes SSE: token, citations, done, error</text>

    <rect x="792" y="142" width="296" height="52" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="802" y="160" fill="#f8fafc" font-size="11" font-weight="600">DemoSessionRedisService</text>
    <text x="802" y="174" fill="#94a3b8" font-size="10">Enforces IP sliding quota (5 msgs / 2 hours)</text>
    <text x="802" y="186" fill="#94a3b8" font-size="10">Cryptographic X-Demo-Token validation</text>

    <rect x="792" y="202" width="296" height="50" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="802" y="220" fill="#f8fafc" font-size="11" font-weight="600">SessionBranchingService</text>
    <text x="802" y="235" fill="#94a3b8" font-size="10">Fork conversation trees from any past assistant message</text>
  </g>

  <!-- LAYER 3: DATA PERSISTENCE & REPOSITORIES -->
  <g transform="translate(40, 560)">
    <rect width="1120" height="215" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2" filter="url(#shadow-lld)"/>
    <rect x="16" y="12" width="160" height="26" rx="6" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="26" y="29" fill="#fbbf24" font-size="11" font-weight="700">3. PERSISTENCE &amp; REPO LAYER</text>

    <!-- JPA Repositories -->
    <rect x="20" y="48" width="540" height="152" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="32" y="70" fill="#fbbf24" font-size="12" font-weight="600">Spring Data JPA Repositories (Flat UUID Relationships)</text>
    
    <rect x="32" y="82" width="240" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="42" y="100" fill="#f8fafc" font-size="11" font-weight="600">GitRepoRepository</text>
    <text x="42" y="115" fill="#94a3b8" font-size="10">findByIdAndUserId(repoId, userId)</text>

    <rect x="285" y="82" width="260" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="295" y="100" fill="#f8fafc" font-size="11" font-weight="600">ChatSessionRepository</text>
    <text x="295" y="115" fill="#94a3b8" font-size="10">findByRepositoryIdOrderByCreatedAtDesc</text>

    <rect x="32" y="138" width="240" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="42" y="156" fill="#f8fafc" font-size="11" font-weight="600">ChatMessageRepository</text>
    <text x="42" y="171" fill="#94a3b8" font-size="10">findBySessionIdOrderByCreatedAtAsc</text>

    <rect x="285" y="138" width="260" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="295" y="156" fill="#f8fafc" font-size="11" font-weight="600">UserRepository &amp; MessageReportRepo</text>
    <text x="295" y="171" fill="#94a3b8" font-size="10">findByGithubId(githubId)</text>

    <!-- Vector Store & pgvector -->
    <rect x="580" y="48" width="520" height="152" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="592" y="70" fill="#10b981" font-size="12" font-weight="600">Spring AI PgVectorStore &amp; Extension Mapping</text>

    <rect x="592" y="82" width="240" height="104" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="602" y="102" fill="#38bdf8" font-size="11" font-weight="600">vector_store Table</text>
    <text x="602" y="120" fill="#94a3b8" font-size="10">• id: UUID (PK)</text>
    <text x="602" y="134" fill="#94a3b8" font-size="10">• content: text (Code chunk)</text>
    <text x="602" y="148" fill="#94a3b8" font-size="10">• metadata: JSON (repoId, filePath, chunkIndex)</text>
    <text x="602" y="162" fill="#94a3b8" font-size="10">• embedding: vector(1536)</text>
    <text x="602" y="176" fill="#10b981" font-size="10">• HNSW Index: COSINE_DISTANCE</text>

    <rect x="845" y="82" width="245" height="104" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="855" y="102" fill="#f59e0b" font-size="11" font-weight="600">Relational Isolation Rules</text>
    <text x="855" y="120" fill="#94a3b8" font-size="10">• Zero @ManyToOne entity joins</text>
    <text x="855" y="134" fill="#94a3b8" font-size="10">• Prevents N+1 query surprises</text>
    <text x="855" y="148" fill="#94a3b8" font-size="10">• Database-level ON DELETE CASCADE</text>
    <text x="855" y="162" fill="#94a3b8" font-size="10">• Strict user isolation via repo.user_id</text>
    <text x="855" y="176" fill="#10b981" font-size="10">• Zero data leakage across repositories</text>
  </g>
</svg>
